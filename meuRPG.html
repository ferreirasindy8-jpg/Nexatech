<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slender Man - Edição Completa</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020202;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff;
            user-select: none;
            touch-action: none;
        }
        
        #canvas-container {
            position: fixed;
            inset: 0;
        }
        
        canvas {
            display: block;
        }
        
        #hud {
            position: fixed;
            z-index: 20;
            inset: 0;
            pointer-events: none;
        }
        
        .panel {
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 12px;
        }
        
        #playerInfo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 270px;
            padding: 12px 16px;
            display: flex;
            gap: 14px;
            align-items: center;
            color: #ecf0f1;
        }
        
        #portrait {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #111;
            font-size: 26px;
            border: 2px solid #777;
        }
        
        #statusBars {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .bar>div {
            height: 100%;
            transition: width 0.15s linear;
            border-radius: 3px;
        }
        
        #staminaFill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 100%;
        }
        
        #sanityFill {
            background: linear-gradient(90deg, #9b59b6, #8e44ad);
            width: 100%;
        }
        
        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            padding: 0;
            display: grid;
            place-items: center;
        }
        
        #minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #controlsHint {
            position: absolute;
            left: 20px;
            bottom: 20px;
            padding: 14px 18px;
            font-size: 13px;
            line-height: 1.6;
            color: #bdc3c7;
            font-weight: 600;
        }
        
        #recordDisplay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            font-size: 12px;
            color: #f1c40f;
            font-weight: 700;
        }
        /* OVERLAYS */
        
        #staticOverlay {
            position: fixed;
            inset: 0;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
            mix-blend-mode: screen;
        }
        
        #vignette {
            position: fixed;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
        }
        
        #flashOverlay {
            position: fixed;
            inset: 0;
            z-index: 16;
            pointer-events: none;
            background: #fff;
            opacity: 0;
            transition: opacity 0.4s;
        }
        
        #jumpscareOverlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            pointer-events: none;
            background: #000;
            opacity: 0;
            display: grid;
            place-items: center;
            transition: opacity 0.1s;
        }
        
        #jumpscareOverlay img {
            width: 80vmin;
            height: 80vmin;
            object-fit: contain;
            animation: shake 0.1s infinite;
        }
        
        @keyframes shake {
            0% {
                transform: translate(0, 0) scale(1.05);
            }
            25% {
                transform: translate(-8px, 4px) scale(1.1);
            }
            50% {
                transform: translate(6px, -5px) scale(1.08);
            }
            75% {
                transform: translate(-4px, 7px) scale(1.12);
            }
            100% {
                transform: translate(3px, -3px) scale(1.06);
            }
        }
        
        #gameMessage {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        
        #gameMessage .message-card {
            max-width: 480px;
            width: 100%;
            padding: 30px;
            background: rgba(8, 12, 10, .94);
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 18px;
            box-shadow: 0 18px 70px #000;
        }
        
        #gameMessage h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 6vw, 46px);
        }
        
        #gameMessage p {
            color: #c7d0ca;
            line-height: 1.6;
        }
        
        #gameMessage .stat {
            color: #f1c40f;
            font-weight: 700;
            margin-top: 10px;
        }
        
        #restartButton {
            border: 0;
            border-radius: 10px;
            padding: 13px 22px;
            margin-top: 16px;
            background: #b51f2b;
            color: white;
            font-weight: 800;
            cursor: pointer;
            font-size: 15px;
        }
        
        #restartButton:hover {
            background: #e12d3c;
        }
        
        #loading {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            font-weight: bold;
            transition: opacity 0.5s ease;
        }
        /* MOBILE CONTROLS */
        
        #mobileControls {
            display: none;
        }
        
        @media (hover: none) and (pointer: coarse) {
            #mobileControls {
                display: block;
            }
            #controlsHint {
                display: none;
            }
            #playerInfo {
                width: auto;
                max-width: 60vw;
                padding: 9px 11px;
            }
            #minimap-container {
                width: 110px;
                height: 110px;
                top: 10px;
                right: 10px;
            }
            #playerInfo {
                top: 10px;
                left: 10px;
            }
            #recordDisplay {
                bottom: 10px;
                right: 10px;
            }
        }
        
        @media (max-width: 600px) {
            #controlsHint {
                display: none;
            }
            #playerInfo {
                width: auto;
                max-width: 60vw;
                padding: 9px 11px;
            }
            #minimap-container {
                width: 110px;
                height: 110px;
                top: 10px;
                right: 10px;
            }
            #playerInfo {
                top: 10px;
                left: 10px;
            }
        }
        
        #joystickZone {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.25);
            z-index: 30;
            pointer-events: auto;
            display: none;
        }
        
        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55px;
            height: 55px;
            margin: -27.5px 0 0 -27.5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.05s;
        }
        
        #lookZone {
            position: fixed;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: 25;
            pointer-events: auto;
            display: none;
        }
        
        #btnRun,
        #btnFlash {
            position: fixed;
            z-index: 30;
            pointer-events: auto;
            display: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }
        
        #btnRun {
            bottom: 110px;
            right: 20px;
        }
        
        #btnFlash {
            bottom: 30px;
            right: 20px;
        }
        
        @media (hover: none) and (pointer: coarse) {
            #joystickZone,
            #lookZone,
            #btnRun,
            #btnFlash {
                display: block;
            }
        }
    </style>
</head>

<body>

    <div id="loading">🌲 A preparar a Floresta & Slender Man...<br><span style="font-size:14px;color:#888;margin-top:10px;">Clica no ecrã para ativar o som</span></div>
    <div id="canvas-container"></div>

    <div id="staticOverlay"></div>
    <div id="vignette"></div>
    <div id="flashOverlay"></div>
    <div id="jumpscareOverlay"><img id="jumpscareImg" alt=""></div>

    <div id="gameMessage">
        <div class="message-card">
            <h1 id="messageTitle">Fim de jogo</h1>
            <p id="messageText">A floresta ainda guarda seus segredos...</p>
            <p class="stat" id="messageStats"></p>
            <button id="restartButton" type="button">Jogar novamente</button>
        </div>
    </div>

    <div id="hud">
        <div id="playerInfo" class="panel">
            <div id="portrait">📄</div>
            <div style="flex:1;min-width:0;">
                <b style="font-size:15px;color:#fff;">Investigador</b>
                <div style="font-size:11px;color:#aaa;" id="speedStatus">A explorar</div>
                <div style="font-size:12px;color:#e74c3c;font-weight:bold;margin-top:2px;" id="coinStatus">Páginas: 0 / 8</div>
                <div id="statusBars">
                    <div class="bar">
                        <div id="staminaFill"></div>
                    </div>
                    <div class="bar">
                        <div id="sanityFill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="minimap-container" class="panel">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>

        <div id="controlsHint" class="panel">
            <b>WASD/Setas:</b> Mover &nbsp; <b>Shift:</b> Correr<br>
            <b>N:</b> Lanterna &nbsp; <b>Mouse:</b> Olhar<br>
            <b>Dica:</b> Não olhes fixo para ele...
        </div>

        <div id="recordDisplay" class="panel">🏆 Recorde: --</div>
    </div>

    <div id="mobileControls">
        <div id="joystickZone">
            <div id="joystickKnob"></div>
        </div>
        <div id="lookZone"></div>
        <button id="btnRun" type="button">⚡</button>
        <button id="btnFlash" type="button">🔦</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ============ ÁUDIO ============
        let audioCtx = null;
        let musicaIniciada = false;
        let atmosferaInterval = null;

        function iniciarAudio() {
            if (musicaIniciada) return;
            audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            tocarAtmosferaSlender();
            musicaIniciada = true;
        }

        function pararAudio() {
            if (atmosferaInterval) {
                clearInterval(atmosferaInterval);
                atmosferaInterval = null;
            }
        }

        function tocarAtmosferaSlender() {
            pararAudio();
            atmosferaInterval = setInterval(() => {
                if (!audioCtx || gameState !== "playing") return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(45, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(25, audioCtx.currentTime + 3.5);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 3.5);
            }, 5500);
        }

        function tocarSomPasso() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(70, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function tocarSomPagina() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function tocarJumpscare() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }

        window.addEventListener('click', iniciarAudio);
        window.addEventListener('keydown', iniciarAudio);
        window.addEventListener('touchstart', iniciarAudio, {
            passive: true
        });

        // ============ CENA 3D ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17251f);
        scene.fog = new THREE.FogExp2(0x18271f, 0.012);

        const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 300);
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.45;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const obstaculos = [];
        const paginas = [];
        let paginasColetadas = 0;
        const totalPaginas = 8;
        let gameState = "playing";
        let elapsed = 0;
        let passoCooldown = 0;
        let tempoPasso = 0;
        let tempoJogo = 0;
        let stamina = 100;
        let sanidade = 100;
        let tempoOlhandoSlender = 0;

        const ambientLight = new THREE.AmbientLight(0x718477, 0.85);
        scene.add(ambientLight);
        const luar = new THREE.DirectionalLight(0xb4c9d8, 0.85);
        luar.position.set(-45, 70, 25);
        scene.add(luar);

        const lanterna = new THREE.SpotLight(0xffffff, 3.5, 40, Math.PI / 4.5, 0.5, 1);
        lanterna.castShadow = true;
        scene.add(lanterna);
        scene.add(lanterna.target);

        // MATERIAIS
        const matTerra = new THREE.MeshStandardMaterial({
            color: 0x120f0d,
            roughness: 0.8
        });

        function criarTexturaProcedural(tipo) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            if (tipo === 'casca') {
                ctx.fillStyle = '#38251a';
                ctx.fillRect(0, 0, 256, 256);
                for (let i = 0; i < 95; i++) {
                    const x = Math.random() * 256;
                    ctx.strokeStyle = i % 3 ? 'rgba(12,7,4,.34)' : 'rgba(112,75,45,.25)';
                    ctx.lineWidth = 1 + Math.random() * 4;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.bezierCurveTo(x - 18, 70, x + 15, 170, x + (Math.random() - .5) * 25, 256);
                    ctx.stroke();
                }
                for (let i = 0; i < 500; i++) {
                    ctx.fillStyle = `rgba(8,5,3,${Math.random() * .16})`;
                    ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 2 + Math.random() * 12);
                }
            } else {
                ctx.fillStyle = '#17251a';
                ctx.fillRect(0, 0, 256, 256);
                for (let i = 0; i < 1800; i++) {
                    const v = 15 + Math.random() * 55;
                    ctx.fillStyle = `rgba(${v|0},${(v+13)|0},${(v+5)|0},${.08 + Math.random()*.22})`;
                    ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 5, 1 + Math.random() * 4);
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }
        const texturaCasca = criarTexturaProcedural('casca');
        const texturaChao = criarTexturaProcedural('chao');

        const matGrama = new THREE.MeshStandardMaterial({
            map: texturaChao,
            color: 0x7b8875,
            roughness: 0.9
        });
        const terrenoGeo = new THREE.PlaneGeometry(350, 350, 100, 100);
        const posTerreno = terrenoGeo.attributes.position;
        for (let i = 0; i < posTerreno.count; i++) {
            const x = posTerreno.getX(i),
                y = posTerreno.getY(i);
            const ondulacao = Math.sin(x * .075) * .10 + Math.cos(y * .062) * .08 + Math.sin((x + y) * .035) * .13;
            posTerreno.setZ(i, ondulacao);
        }
        terrenoGeo.computeVertexNormals();
        const floor = new THREE.Mesh(terrenoGeo, matGrama);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const estrada = new THREE.Mesh(new THREE.PlaneGeometry(12, 350), matTerra);
        estrada.rotation.x = -Math.PI / 2;
        estrada.position.y = 0.015;
        estrada.receiveShadow = true;
        scene.add(estrada);

        const matCasca = new THREE.MeshStandardMaterial({
            map: texturaCasca,
            color: 0x9a8068,
            roughness: 1
        });
        const matCascaClara = new THREE.MeshStandardMaterial({
            color: 0x493322,
            roughness: 1
        });
        const matFolhaEscura = new THREE.MeshStandardMaterial({
            color: 0x102318,
            roughness: 1,
            flatShading: true
        });
        const matFolhaMedia = new THREE.MeshStandardMaterial({
            color: 0x23452b,
            roughness: 1,
            flatShading: true
        });
        const matMusgo = new THREE.MeshStandardMaterial({
            color: 0x263b24,
            roughness: 1,
            flatShading: true
        });
        const matPedra = new THREE.MeshStandardMaterial({
            color: 0x454945,
            roughness: 1,
            flatShading: true
        });
        const matPagina = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0x666666,
            roughness: 0.3
        });

        function cilindroEntre(a, b, raioA, raioB, material, parent) {
            const va = new THREE.Vector3(...a),
                vb = new THREE.Vector3(...b);
            const direcao = new THREE.Vector3().subVectors(vb, va);
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(raioB, raioA, direcao.length(), 7), material);
            mesh.position.copy(va).add(vb).multiplyScalar(0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direcao.normalize());
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            parent.add(mesh);
            return mesh;
        }

        function criarArvore(x, z) {
            const grupo = new THREE.Group();
            const altura = 8 + Math.random() * 7;
            const raio = 0.30 + Math.random() * 0.32;
            const tronco = new THREE.Mesh(new THREE.CylinderGeometry(raio * 0.62, raio * 1.55, altura, 9, 4), matCasca);
            tronco.position.y = altura / 2;
            tronco.rotation.z = (Math.random() - 0.5) * 0.08;
            tronco.castShadow = true;
            tronco.receiveShadow = true;
            grupo.add(tronco);
            const musgo = new THREE.Mesh(new THREE.CylinderGeometry(raio * 2.0, raio * 2.4, .13, 9), matMusgo);
            musgo.position.y = .09;
            musgo.scale.set(1, 1, .82);
            grupo.add(musgo);
            for (let r = 0; r < 5; r++) {
                const ang = r * Math.PI / 2 + Math.random() * 0.5;
                cilindroEntre([Math.cos(ang) * 0.18, 0.18, Math.sin(ang) * 0.18], [Math.cos(ang) * (0.8 + Math.random() * 0.35), 0.04, Math.sin(ang) * (0.8 + Math.random() * 0.35)],
                    0.17, 0.035, matCascaClara, grupo);
            }
            for (let b = 0; b < 5; b++) {
                const y = altura * (0.48 + Math.random() * 0.38);
                const ang = Math.random() * Math.PI * 2;
                const len = 1.8 + Math.random() * 2.1;
                cilindroEntre([Math.cos(ang) * 0.12, y, Math.sin(ang) * 0.12], [Math.cos(ang) * len, y + 0.8 + Math.random() * 1.1, Math.sin(ang) * len],
                    0.16, 0.045, matCasca, grupo);
            }
            const niveis = 4 + Math.floor(Math.random() * 2);
            for (let n = 0; n < niveis; n++) {
                const cone = new THREE.Mesh(new THREE.ConeGeometry((2.8 - n * 0.32) * (0.82 + Math.random() * 0.32), 3.5, 9, 2),
                    n % 2 ? matFolhaMedia : matFolhaEscura);
                cone.position.set((Math.random() - 0.5) * 0.5, altura * 0.48 + n * 1.42, (Math.random() - 0.5) * 0.5);
                cone.rotation.y = Math.random() * Math.PI;
                cone.castShadow = true;
                cone.receiveShadow = true;
                grupo.add(cone);
            }
            grupo.position.set(x, 0, z);
            grupo.rotation.y = Math.random() * Math.PI * 2;
            scene.add(grupo);
            obstaculos.push({
                tipo: 'arvore',
                x,
                z,
                raio: 0.9
            });
        }

        function criarPedra(x, z, escala) {
            const pedra = new THREE.Mesh(new THREE.DodecahedronGeometry(escala, 0), matPedra);
            pedra.position.set(x, escala * 0.45, z);
            pedra.rotation.set(Math.random(), Math.random() * 3, Math.random());
            pedra.scale.set(1.2, 0.65 + Math.random() * 0.35, 0.85);
            pedra.castShadow = true;
            pedra.receiveShadow = true;
            scene.add(pedra);
            obstaculos.push({
                tipo: 'pedra',
                x,
                z,
                raio: escala * 0.9
            });
        }

        function criarArbusto(x, z, escala = 1) {
            const g = new THREE.Group();
            const folhas = [matFolhaEscura, matFolhaMedia, matMusgo];
            const pontas = 5 + Math.floor(Math.random() * 4);
            for (let i = 0; i < pontas; i++) {
                const a = i / pontas * Math.PI * 2;
                const h = (.55 + Math.random() * .65) * escala;
                const folha = new THREE.Mesh(new THREE.ConeGeometry((.24 + Math.random() * .18) * escala, h, 5), folhas[i % folhas.length]);
                folha.position.set(Math.cos(a) * .32 * escala, h * .38, Math.sin(a) * .32 * escala);
                folha.rotation.z = (Math.random() - .5) * .55;
                folha.rotation.x = (Math.random() - .5) * .45;
                folha.castShadow = true;
                g.add(folha);
            }
            g.position.set(x, 0, z);
            g.rotation.y = Math.random() * Math.PI * 2;
            scene.add(g);
        }

        function criarTroncoCaido(x, z) {
            const comprimento = 2.5 + Math.random() * 4;
            const tronco = new THREE.Mesh(new THREE.CylinderGeometry(.22 + Math.random() * .12, .30, comprimento, 9, 2), matCasca);
            tronco.position.set(x, .35, z);
            tronco.rotation.z = Math.PI / 2 + (Math.random() - .5) * .13;
            tronco.rotation.y = Math.random() * Math.PI;
            tronco.castShadow = true;
            tronco.receiveShadow = true;
            scene.add(tronco);
        }

        function criarSamambaia(x, z) {
            const g = new THREE.Group();
            for (let f = 0; f < 7; f++) {
                const a = f / 7 * Math.PI * 2;
                const haste = new THREE.Mesh(new THREE.ConeGeometry(.055, 1.05 + Math.random() * .5, 5), matFolhaMedia);
                haste.position.set(Math.cos(a) * .38, .48, Math.sin(a) * .38);
                haste.rotation.z = Math.cos(a) * .55;
                haste.rotation.x = Math.sin(a) * .55;
                g.add(haste);
            }
            g.position.set(x, 0, z);
            scene.add(g);
        }

        for (let i = 0; i < 88; i++) {

            if (Math.abs(x) > 8 || Math.abs(z) > 8) criarArvore(x, z);
        }
        for (let i = 0; i < 115; i++) {

            if (Math.abs(x) > 7 || Math.abs(z) > 7) criarArbusto(x, z, .65 + Math.random() * .9);
        }
        for (let i = 0; i < 42; i++) {

        }

            if (Math.abs(x) > 10 || Math.abs(z) > 10) criarPedra(x, z, 0.35 + Math.random() * 0.75);
        }
